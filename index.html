<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ういた！">
<link rel="manifest" href="manifest.json">
<title>ういた！</title>
<style>
:root{--bg:#f7f4ee;--card:#fff;--ink:#292725;--muted:#8b857d;--accent:#ef7d45;--line:#eee8df}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
button,input{font:inherit}button{border:0;cursor:pointer}
.app{max-width:620px;margin:auto;min-height:100vh;padding:24px 18px 110px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.logo{font-weight:800;font-size:25px;letter-spacing:-.04em}.logo b{color:var(--accent)}
.iconbtn{width:42px;height:42px;border-radius:50%;background:#fff;font-size:19px}
.hero{background:#fff;border-radius:28px;padding:28px 24px;margin-bottom:18px;box-shadow:0 3px 18px #00000006}
.month{color:var(--muted);font-size:14px}.total{font-size:46px;font-weight:850;letter-spacing:-.05em;margin:5px 0}.yen{font-size:20px;margin-right:2px}.sub{color:var(--muted);font-size:14px}
.actions{display:flex;gap:10px;margin-top:20px}.primary{flex:1;background:var(--accent);color:#fff;border-radius:17px;padding:15px;font-weight:750}.secondary{background:#f4efe8;border-radius:17px;padding:15px 17px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:28px 3px 12px;font-weight:750}.section-title span{color:var(--muted);font-size:13px;font-weight:500}
.record{background:#fff;border-radius:20px;padding:16px;margin:9px 0;display:flex;gap:13px;align-items:center}.emoji{width:46px;height:46px;border-radius:15px;background:#f7f3ed;display:grid;place-items:center;font-size:23px}.rbody{flex:1;min-width:0}.title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note{font-size:12px;color:var(--muted);margin-top:3px}.amount{font-weight:800;color:var(--accent);white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:35px 10px}
.nav{position:fixed;bottom:0;left:0;right:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:#f7f4eedf;backdrop-filter:blur(14px);display:flex;justify-content:center}.nav button{background:var(--ink);color:#fff;border-radius:20px;padding:15px 30px;font-weight:750;box-shadow:0 8px 24px #0002}
.sheet{position:fixed;inset:0;background:#0005;display:none;align-items:flex-end;z-index:10}.sheet.open{display:flex}.panel{width:100%;max-width:620px;margin:auto;background:#fff;border-radius:28px 28px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.handle{width:42px;height:5px;background:#ddd;border-radius:10px;margin:0 auto 18px}.panel h2{margin:0 0 18px;font-size:20px}.field{margin:13px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}.field input{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}.emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.emojis button{background:#f7f3ed;border-radius:14px;padding:11px;font-size:23px}.emojis button.sel{outline:2px solid var(--accent);background:#fff3eb}.close{width:100%;background:#f2eee8;border-radius:15px;padding:14px;margin-top:9px}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">うい<b>た！</b></div><button class="iconbtn" id="summaryBtn">📊</button></header>
<section class="hero">
<div class="month" id="month"></div>
<div class="total"><span class="yen">¥</span><span id="total">0</span></div>
<div class="sub"><span id="count">0</span>件の「ういた！」</div>
<div class="actions"><button class="primary" id="addBtn">＋ ういた！を記録</button><button class="secondary" id="clearBtn">↺</button></div>
</section>
<div class="section-title">最近の記録 <span id="memberLabel">自分の記録</span></div>
<div id="records"></div>
</div>
<div class="nav"><button id="navAdd">＋ ういた！を記録する</button></div>

<div class="sheet" id="sheet">
<div class="panel">
<div class="handle"></div><h2>ういた！を記録</h2>
<div class="field"><label>何をやめた・買わなかった？</label><div class="emojis" id="emojis"></div></div>
<div class="field"><label>タイトル</label><input id="title" placeholder="例：コンビニスイーツを買わなかった"></div>
<div class="field"><label>ういた金額</label><input id="amount" inputmode="numeric" type="number" min="0" placeholder="350"></div>
<div class="field"><label>ひとこと（任意）</label><input id="note" placeholder="家のお菓子で代用！"></div>
<button class="primary" id="save" style="width:100%;margin-top:6px">ういた！ ✨</button>
<button class="close" id="close">キャンセル</button>
</div></div>
<script>
const icons=["🥤","🍰","☕","🍜","🛍️","🎮","📚","🚕","🍺","👕","💄","🏠"];
const key="uitata_records_v1";
let records=JSON.parse(localStorage.getItem(key)||"[]"), selected="🥤";
const $=id=>document.getElementById(id);
$("month").textContent=new Intl.DateTimeFormat("ja-JP",{year:"numeric",month:"long"}).format(new Date());
function render(){
 const now=new Date(), ym=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
 const rs=records.filter(r=>r.ym===ym).sort((a,b)=>b.ts-a.ts);
 const total=rs.reduce((s,r)=>s+r.amount,0);
 $("total").textContent=total.toLocaleString(); $("count").textContent=rs.length;
 $("records").innerHTML=rs.length?rs.map(r=>`<div class="record"><div class="emoji">${r.icon}</div><div class="rbody"><div class="title">${esc(r.title)}</div>${r.note?`<div class="note">${esc(r.note)}</div>`:""}</div><div class="amount">+¥${r.amount.toLocaleString()}</div></div>`).join(""):`<div class="empty">まだ「ういた！」がありません。<br>小さな節約から記録してみよう ✨</div>`;
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function openSheet(){ $("sheet").classList.add("open"); $("title").focus(); }
function closeSheet(){ $("sheet").classList.remove("open"); }
$("emojis").innerHTML=icons.map((x,i)=>`<button data-i="${i}" class="${i===0?"sel":""}">${x}</button>`).join("");
$("emojis").onclick=e=>{const b=e.target.closest("button");if(!b)return;selected=icons[b.dataset.i];document.querySelectorAll(".emojis button").forEach(x=>x.classList.remove("sel"));b.classList.add("sel")};
[$("addBtn"),$("navAdd")].forEach(b=>b.onclick=openSheet);
$("close").onclick=closeSheet;
$("sheet").onclick=e=>{if(e.target===$("sheet"))closeSheet()};
$("save").onclick=()=>{
 const title=$("title").value.trim()||"買わなかった";
 const amount=Number($("amount").value||0); if(!amount){$("amount").focus();return}
 const d=new Date();
 records.push({icon:selected,title,amount,note:$("note").value.trim(),ts:Date.now(),ym:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")});
 localStorage.setItem(key,JSON.stringify(records)); ["title","amount","note"].forEach(id=>$(id).value=""); closeSheet(); render();
};
$("clearBtn").onclick=()=>{if(confirm("この端末の記録を全部消しますか？")){localStorage.removeItem(key);records=[];render()}};
$("summaryBtn").onclick=()=>alert("月のまとめ・家族共有は次の開発ステップで追加します！");
render();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}</script></body>
</html>
