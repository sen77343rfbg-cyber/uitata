<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ee"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="UITA！">
<link rel="manifest" href="manifest.json"><title>UITA！</title>
<style>
:root{--bg:#f7f4ee;--card:#fff;--ink:#292725;--muted:#8b857d;--accent:#ef7d45;--line:#eee8df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}button,input{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}.app{max-width:680px;margin:auto;min-height:100vh;padding:22px 18px 100px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.logo{font-weight:900;font-size:25px;letter-spacing:.02em}.logo span{color:var(--accent)}.iconbtn{width:42px;height:42px;border-radius:50%;background:#fff;font-size:18px}.card,.hero{background:#fff;border-radius:24px;padding:20px;margin:12px 0}.hero{padding:25px 22px}.eyebrow{color:var(--muted);font-size:13px}.big{font-size:43px;font-weight:900;letter-spacing:-.05em;margin:3px 0}.sub{color:var(--muted);font-size:13px}.primary{width:100%;background:var(--accent);color:#fff;border-radius:16px;padding:14px;font-weight:800}.secondary{background:#f3eee7;border-radius:15px;padding:12px 15px;font-weight:700}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.section{margin:25px 2px 10px;font-weight:800}.muted{color:var(--muted)}.group{display:flex;align-items:center;gap:13px;padding:15px 0;border-bottom:1px solid var(--line);cursor:pointer}.group:last-child{border-bottom:0}.gicon{width:48px;height:48px;border-radius:16px;background:#f7f3ed;display:grid;place-items:center;font-size:24px}.grow{flex:1}.gname{font-weight:800}.gsum{font-size:12px;color:var(--muted);margin-top:3px}.arrow{color:#bbb}.tabs{display:flex;gap:8px;margin:12px 0}.tab{flex:1;background:#eee9e1;color:#777;border-radius:14px;padding:11px;font-weight:700}.tab.active{background:#292725;color:#fff}.record{background:#fff;border-radius:20px;padding:16px;margin:9px 0;display:flex;gap:12px}.emoji{width:45px;height:45px;border-radius:14px;background:#f7f3ed;display:grid;place-items:center;font-size:22px}.rbody{flex:1;min-width:0}.title{font-weight:750}.note{font-size:12px;color:var(--muted);margin-top:3px}.amount{font-weight:850;color:var(--accent);white-space:nowrap}.meta{font-size:11px;color:#aaa;margin-top:7px}.reacts{display:flex;gap:6px;margin-top:9px}.react{background:#f5f1eb;border-radius:10px;padding:4px 7px;font-size:12px}.empty{text-align:center;color:var(--muted);padding:30px 10px}.bottom{position:fixed;bottom:0;left:0;right:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:#f7f4eedf;backdrop-filter:blur(14px)}.bottom button{display:block;max-width:680px;margin:auto;background:#292725;color:#fff;border-radius:18px;padding:14px 26px;font-weight:800;width:100%}.sheet{position:fixed;inset:0;background:#0005;display:none;align-items:flex-end;z-index:20}.sheet.open{display:flex}.panel{width:100%;max-width:680px;margin:auto;background:#fff;border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}.handle{width:42px;height:5px;background:#ddd;border-radius:10px;margin:0 auto 18px}.panel h2{margin:0 0 17px}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.field input{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}.emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.emojis button{background:#f7f3ed;border-radius:13px;padding:10px;font-size:22px}.emojis button.sel{outline:2px solid var(--accent);background:#fff3eb}.close{width:100%;background:#f1ede7;border-radius:14px;padding:13px;margin-top:8px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#292725;color:#fff;padding:11px 16px;border-radius:14px;display:none;z-index:30;font-size:13px}.toast.show{display:block}.monthrow{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}.monthrow strong{font-size:18px}.auth{max-width:430px;margin:12vh auto 0;padding:0 18px}.auth .card{padding:26px}.auth h1{margin-top:0}.auth input{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;margin:6px 0 10px}.invitebox{display:flex;justify-content:space-between;align-items:center;background:#f7f3ed;border-radius:16px;padding:12px 14px;margin:14px 0}.invite-label{font-size:11px;color:var(--muted);margin-bottom:2px}.invitebox strong{font-size:20px;letter-spacing:.12em}.smallbtn{background:none;color:var(--accent);font-weight:700;padding:10px 0}
</style></head><body>
<div id="auth" class="auth"><div class="logo" style="margin:0 0 18px 4px">UITA<span>！</span></div><div class="card"><h1>みんなで、UITA！</h1><p class="muted">買わなかった・やめた・工夫した。<br>小さな「UITA！」を家族や友達と共有しよう。</p><label class="muted">メールアドレス</label><input id="email" type="email"><label class="muted">パスワード</label><input id="password" type="password"><input id="displayName" placeholder="表示名（新規登録時）"><button class="primary" id="signup">新規登録</button><button class="smallbtn" id="login">ログイン</button><p id="authMsg" class="muted" style="font-size:12px"></p></div></div>
<div id="app" class="app hidden"><header><div class="logo">UITA<span>！</span></div><button class="iconbtn" id="accountBtn">👤</button></header><div id="home"></div></div>
<div id="bottom" class="bottom hidden"><button id="addBtn">＋ UITA！を記録する</button></div>
<div class="sheet" id="recordSheet"><div class="panel"><div class="handle"></div><h2>UITA！を記録</h2><div class="field"><label>アイコン</label><div class="emojis" id="emojis"></div></div><div class="field"><label>何をやめた・買わなかった？</label><input id="title" placeholder="例：コンビニスイーツを買わなかった"></div><div class="field"><label>ういた金額</label><input id="amount" inputmode="numeric" type="number" min="0" placeholder="350"></div><div class="field"><label>ひとこと（任意）</label><input id="note" placeholder="家のお菓子で代用！"></div><button class="primary" id="saveRecord">UITA！✨</button><button class="close" data-close="recordSheet">キャンセル</button></div></div>
<div class="sheet" id="groupSheet"><div class="panel"><div class="handle"></div><h2>グループを作る</h2><div class="field"><label>グループ名</label><input id="groupName" placeholder="例：夫婦"></div><div class="field"><label>アイコン</label><div class="emojis" id="groupEmojis"></div></div><button class="primary" id="createGroup">グループを作成</button><button class="close" data-close="groupSheet">キャンセル</button><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h2>招待コードで参加</h2><div class="field"><input id="inviteCode" placeholder="6文字のコード"></div><button class="secondary" style="width:100%" id="joinGroup">参加する</button></div></div>
<div class="sheet" id="accountSheet"><div class="panel"><div class="handle"></div><h2>アカウント</h2><p id="accountEmail" class="muted"></p><button class="secondary" style="width:100%" id="logout">ログアウト</button><button class="close" data-close="accountSheet">閉じる</button></div></div>
<div class="sheet" id="historySheet"><div class="panel"><div class="handle"></div><h2 id="historyTitle">月の履歴</h2><div id="history"></div><button class="close" data-close="historySheet">閉じる</button></div></div><div class="toast" id="toast"></div>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const cfg=window.UITA_CONFIG||{};const sb=supabase.createClient(cfg.url||"",cfg.anonKey||"");const $=id=>document.getElementById(id);const icons=["🥤","🍰","☕","🍜","🛍️","🎮","📚","🚕","🍺","👕","💄","🏠"];let user=null,groups=[],currentGroup=null,selectedIcon="🥤",selectedGroupIcon="💑",channel=null;
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2200)}function openSheet(id){$(id).classList.add("open")}function closeSheet(id){$(id).classList.remove("open")}document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>closeSheet(b.dataset.close));
function emojiButtons(el,arr,get,set){el.innerHTML=arr.map((x,i)=>`<button class="${x===get()?"sel":""}" data-i="${i}">${x}</button>`).join("");el.onclick=e=>{let b=e.target.closest("button");if(!b)return;set(arr[b.dataset.i]);[...el.children].forEach(x=>x.classList.remove("sel"));b.classList.add("sel")}}emojiButtons($("emojis"),icons,()=>selectedIcon,x=>selectedIcon=x);emojiButtons($("groupEmojis"),["💑","👨‍👩‍👧","👭","🏠","💰","✨"],()=>selectedGroupIcon,x=>selectedGroupIcon=x);
async function refreshUser(){const {data:{session}}=await sb.auth.getSession();user=session?.user||null;$("auth").classList.toggle("hidden",!!user);$("app").classList.toggle("hidden",!user);$("bottom").classList.toggle("hidden",!user);if(user){await loadGroups();renderHome()}}
$("signup").onclick=async()=>{const email=$("email").value.trim(),password=$("password").value,display=$("displayName").value.trim();if(!email||password.length<6){$("authMsg").textContent="メールアドレスと6文字以上のパスワードを入力してね";return}const {data,error}=await sb.auth.signUp({email,password});if(error){$("authMsg").textContent=error.message;return}if(data.user)await sb.from("profiles").upsert({id:data.user.id,display_name:display||email.split("@")[0]});$("authMsg").textContent="登録しました。確認メールが必要な設定の場合はメールを確認してね。"};
$("login").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});$("authMsg").textContent=error?error.message:"ログインしました"};$("logout").onclick=async()=>{await sb.auth.signOut();closeSheet("accountSheet")};$("accountBtn").onclick=()=>{$("accountEmail").textContent=user?.email||"";openSheet("accountSheet")};
async function loadGroups(){const {data}=await sb.from("group_members").select("group_id,groups(id,name,emoji,invite_code,created_at)").eq("user_id",user.id);groups=(data||[]).map(x=>x.groups).filter(Boolean)}
async function renderHome(){currentGroup=null;if(channel){await sb.removeChannel(channel);channel=null}$("home").innerHTML=`<section class="hero"><div class="eyebrow">参加中のグループ</div><div class="section" style="margin-top:5px">みんなで「UITA！」を共有しよう</div></section><div class="card"><div class="row between"><strong>グループ</strong><button class="secondary" id="newGroup">＋ 作る / 参加</button></div><div id="groupList"></div></div>`;const list=$("groupList");if(!groups.length)list.innerHTML='<div class="empty">まだグループがありません。<br>「作る / 参加」から始めよう！</div>';else for(const g of groups){const {data:rs}=await sb.from("records").select("amount").eq("group_id",g.id).gte("created_at",new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString());const total=(rs||[]).reduce((s,r)=>s+r.amount,0);list.innerHTML+=`<div class="group" data-gid="${g.id}"><div class="gicon">${g.emoji}</div><div class="grow"><div class="gname">${esc(g.name)}</div><div class="gsum">今月 ¥${total.toLocaleString()}</div></div><div class="arrow">›</div></div>`}$("newGroup").onclick=()=>openSheet("groupSheet");list.onclick=e=>{const el=e.target.closest(".group");if(el)openGroup(el.dataset.gid)}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function openGroup(gid){currentGroup=groups.find(g=>g.id===gid);if(!currentGroup)return;renderGroup()}
async function renderGroup(){const g=currentGroup;$("home").innerHTML=`<button class="smallbtn" id="back">← グループ一覧</button><section class="hero"><div class="eyebrow">${g.emoji} ${esc(g.name)}</div><div class="big" id="groupTotal">¥0</div><div class="sub" id="groupCount">今月 0件</div><div class="invitebox"><div><div class="invite-label">招待コード</div><strong id="inviteCodeDisplay">${esc(g.invite_code||"")}</strong></div><button class="secondary" id="copyInvite">コピー</button></div><div class="tabs"><button class="tab active" id="feedTab">みんなの記録</button><button class="tab" id="historyTab">月の履歴</button></div></section><div id="feed"></div>`;$("back").onclick=renderHome;$("copyInvite").onclick=async()=>{try{await navigator.clipboard.writeText(g.invite_code);toast("招待コードをコピーしたよ！")}catch(e){toast("招待コード："+g.invite_code)}};$("historyTab").onclick=()=>showHistory(g);await loadFeed();subscribeRealtime()}
async function loadFeed(){const start=new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString();const {data,error}=await sb.from("records").select("id,group_id,user_id,icon,title,amount,note,created_at,profiles(display_name),reactions(id,type,user_id)").eq("group_id",currentGroup.id).gte("created_at",start).order("created_at",{ascending:false});if(error){$("feed").innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}const total=(data||[]).reduce((s,r)=>s+r.amount,0);$("groupTotal").textContent="¥"+total.toLocaleString();$("groupCount").textContent="今月 "+(data||[]).length+"件";$("feed").innerHTML=(data||[]).length?data.map(recordHtml).join(""):'<div class="empty">まだ記録がないよ。<br>最初のUITA！を投稿してみよう ✨</div>';document.querySelectorAll(".react").forEach(b=>b.onclick=()=>react(b.dataset.id,b.dataset.type))}
function recordHtml(r){const reactions={};(r.reactions||[]).forEach(x=>reactions[x.type]=(reactions[x.type]||0)+1);const names=Object.entries(reactions).map(([k,v])=>`<button class="react" data-id="${r.id}" data-type="${k}">${k} ${v}</button>`).join("");return `<div class="record"><div class="emoji">${r.icon}</div><div class="rbody"><div class="row between"><div class="title">${esc(r.title)}</div><div class="amount">+¥${Number(r.amount).toLocaleString()}</div></div>${r.note?`<div class="note">${esc(r.note)}</div>`:""}<div class="meta">${esc(r.profiles?.display_name||"メンバー")} · ${new Date(r.created_at).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}</div><div class="reacts">${names}<button class="react" data-id="${r.id}" data-type="👏">👏</button><button class="react" data-id="${r.id}" data-type="❤️">❤️</button><button class="react" data-id="${r.id}" data-type="🔥">🔥</button></div></div></div>`}
async function react(recordId,type){const {data:existing}=await sb.from("reactions").select("id").eq("record_id",recordId).eq("user_id",user.id).eq("type",type).maybeSingle();if(existing)await sb.from("reactions").delete().eq("id",existing.id);else await sb.from("reactions").insert({record_id:recordId,user_id:user.id,type});await loadFeed()}
function subscribeRealtime(){if(channel)sb.removeChannel(channel);channel=sb.channel("group-"+currentGroup.id).on("postgres_changes",{event:"*",schema:"public",table:"records",filter:"group_id=eq."+currentGroup.id},()=>loadFeed()).on("postgres_changes",{event:"*",schema:"public",table:"reactions"},()=>loadFeed()).subscribe()}
$("addBtn").onclick=()=>{if(!currentGroup){toast("先にグループを選んでね");return}openSheet("recordSheet")};
$("saveRecord").onclick=async()=>{if(!currentGroup){toast("グループを選んでね");return}const title=$("title").value.trim()||"買わなかった",amount=Number($("amount").value||0);if(!amount){toast("金額を入れてね");return}const {error}=await sb.from("records").insert({group_id:currentGroup.id,user_id:user.id,icon:selectedIcon,title,amount,note:$("note").value.trim()});if(error){toast(error.message);return}["title","amount","note"].forEach(id=>$(id).value="");closeSheet("recordSheet");toast("UITA！✨");await loadFeed()};
$("createGroup").onclick=async()=>{const name=$("groupName").value.trim();if(!name){toast("グループ名を入れてね");return}const code=Math.random().toString(36).slice(2,8).toUpperCase();const {data:g,error}=await sb.from("groups").insert({name,emoji:selectedGroupIcon,invite_code:code,created_by:user.id}).select().single();if(error){toast(error.message);return}const {error:e2}=await sb.from("group_members").insert({group_id:g.id,user_id:user.id,role:"owner"});if(e2){toast(e2.message);return}closeSheet("groupSheet");$("groupName").value="";await loadGroups();renderHome();toast("グループを作ったよ！ 招待コード: "+code)};
$("joinGroup").onclick=async()=>{const code=$("inviteCode").value.trim().toUpperCase();if(!code){toast("招待コードを入れてね");return}const {data:g}=await sb.from("groups").select("id,name").eq("invite_code",code).maybeSingle();if(!g){toast("その招待コードは見つからないよ");return}const {error}=await sb.from("group_members").upsert({group_id:g.id,user_id:user.id,role:"member"},{onConflict:"group_id,user_id"});if(error){toast(error.message);return}closeSheet("groupSheet");$("inviteCode").value="";await loadGroups();renderHome();toast(g.name+"に参加したよ！")};
async function showHistory(g){const {data,error}=await sb.from("records").select("amount,created_at").eq("group_id",g.id).order("created_at",{ascending:false});if(error){toast(error.message);return}const map={};(data||[]).forEach(r=>{const d=new Date(r.created_at),key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;(map[key]??={total:0,count:0});map[key].total+=r.amount;map[key].count++});const keys=Object.keys(map).sort().reverse();$("historyTitle").textContent=g.emoji+" "+g.name+"｜月の履歴";$("history").innerHTML=keys.length?keys.map(k=>{const[y,m]=k.split("-");return `<div class="monthrow" data-month="${k}"><div><strong>${y}年${Number(m)}月</strong><div class="muted">${map[k].count}件</div></div><strong style="color:var(--accent)">¥${map[k].total.toLocaleString()}</strong></div>`}).join(""):'<div class="empty">まだ履歴がありません。</div>';openSheet("historySheet");$("history").onclick=e=>{const row=e.target.closest(".monthrow");if(row)showMonth(g,row.dataset.month)}}
async function showMonth(g,month){const start=new Date(month+"-01T00:00:00"),end=new Date(start.getFullYear(),start.getMonth()+1,1);const {data}=await sb.from("records").select("id,icon,title,amount,note,created_at,profiles(display_name)").eq("group_id",g.id).gte("created_at",start.toISOString()).lt("created_at",end.toISOString()).order("created_at",{ascending:false});const total=(data||[]).reduce((s,r)=>s+r.amount,0);$("historyTitle").textContent=`${start.getFullYear()}年${start.getMonth()+1}月｜¥${total.toLocaleString()}`;$("history").innerHTML=(data||[]).map(r=>`<div class="record"><div class="emoji">${r.icon}</div><div class="rbody"><div class="row between"><div class="title">${esc(r.title)}</div><div class="amount">+¥${Number(r.amount).toLocaleString()}</div></div>${r.note?`<div class="note">${esc(r.note)}</div>`:""}<div class="meta">${esc(r.profiles?.display_name||"メンバー")}</div></div></div>`).join("")||'<div class="empty">この月は記録がありません。</div>'}
sb.auth.onAuthStateChange(()=>setTimeout(refreshUser,0));refreshUser();
</script></body></html>
